<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>DevDesk - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#c3c6d6",
                    "on-primary": "#002c72",
                    "secondary-container": "#474c54",
                    "on-error": "#690005",
                    "primary": "#b2c5ff",
                    "secondary-fixed-dim": "#c2c6d0",
                    "surface-container-highest": "#2b3640",
                    "background": "#09151d",
                    "primary-container": "#5b8cff",
                    "surface-variant": "#2b3640",
                    "tertiary-fixed": "#ffdcbf",
                    "surface-container-high": "#202b35",
                    "on-surface": "#d8e4f1",
                    "on-tertiary-container": "#412200",
                    "error-container": "#93000a",
                    "primary-fixed-dim": "#b2c5ff",
                    "on-tertiary-fixed": "#2d1600",
                    "inverse-surface": "#d8e4f1",
                    "on-secondary-container": "#b7bcc6",
                    "secondary": "#c2c6d0",
                    "on-primary-fixed-variant": "#0040a0",
                    "error": "#ffb4ab",
                    "outline": "#8d909f",
                    "primary-fixed": "#dae2ff",
                    "surface-container": "#15212a",
                    "on-background": "#d8e4f1",
                    "surface-tint": "#b2c5ff",
                    "on-error-container": "#ffdad6",
                    "surface-dim": "#09151d",
                    "on-tertiary-fixed-variant": "#6a3b00",
                    "surface-bright": "#2f3a44",
                    "surface-container-lowest": "#040f18",
                    "tertiary": "#ffb874",
                    "inverse-on-surface": "#26323b",
                    "tertiary-fixed-dim": "#ffb874",
                    "outline-variant": "#434653",
                    "tertiary-container": "#d47b00",
                    "on-primary-fixed": "#001847",
                    "on-secondary": "#2c3138",
                    "on-primary-container": "#002665",
                    "inverse-primary": "#1857c8",
                    "surface-container-low": "#111d26",
                    "surface": "#09151d",
                    "secondary-fixed": "#dee2ed",
                    "on-secondary-fixed-variant": "#42474f",
                    "on-secondary-fixed": "#171c23",
                    "on-tertiary": "#4b2800"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "md": "12px",
                    "sidebar_width": "240px",
                    "gutter": "16px",
                    "sm": "8px",
                    "xs": "4px",
                    "xl": "24px",
                    "xxl": "32px",
                    "lg": "16px"
            },
            "fontFamily": {
                    "body": ["Geist"],
                    "page-title": ["Geist"],
                    "mono-code": ["JetBrains Mono"],
                    "metadata": ["Geist"],
                    "mono-timer": ["JetBrains Mono"],
                    "section-title": ["Geist"]
            },
            "fontSize": {
                    "body": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "page-title": ["19px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "mono-code": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "metadata": ["11px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "mono-timer": ["14px", {"lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "section-title": ["14px", {"lineHeight": "20px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        body { background-color: #0B0F14; }
        .app-input {
            background-color: #0B0F14;
            border-color: #26303B;
            color: #d8e4f1;
        }
        .app-input:focus {
            border-color: #5B8CFF;
            box-shadow: 0 0 0 2px rgba(91, 140, 255, 0.2);
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center font-body text-body text-on-surface">
<!-- Overlay -->
<div class="fixed inset-0 bg-[#171D26]/80 backdrop-blur-sm flex items-center justify-center z-50">
<!-- Wizard Modal Level 3 (Overlay) -->
<div class="w-[520px] bg-[#11161D] border border-[#26303B] rounded-lg shadow-[0_12px_40px_rgba(0,0,0,0.3)] flex flex-col">
<!-- Header -->
<div class="px-xl py-lg border-b border-[#26303B] flex items-center justify-between">
<div>
<h1 class="font-page-title text-page-title text-on-surface">Welcome to DevDesk</h1>
<p class="font-metadata text-metadata text-on-surface-variant mt-xs">Configure your productivity environment.</p>
</div>
<div class="flex space-x-xs">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="w-2 h-2 rounded-full bg-[#26303B]"></span>
<span class="w-2 h-2 rounded-full bg-[#26303B]"></span>
</div>
</div>
<!-- Content Area -->
<div class="p-xl space-y-lg flex-1 overflow-y-auto" id="step-1">
<!-- Display Name -->
<div class="flex flex-col space-y-xs">
<label class="font-section-title text-section-title text-on-surface" for="display-name">Display Name</label>
<input class="app-input rounded w-full px-md py-sm font-body text-body focus:outline-none" id="display-name" placeholder="e.g. Alex" type="text" value="Alex">
</div>
<!-- Language Toggle -->
<div class="flex flex-col space-y-xs">
<label class="font-section-title text-section-title text-on-surface">Language</label>
<div class="flex border border-[#26303B] rounded w-fit p-xs bg-[#0B0F14]">
<button class="px-md py-sm rounded bg-[#1A2A4A] border-l-2 border-primary-container text-on-surface font-body text-body">English</button>
<button class="px-md py-sm rounded hover:bg-[#171D26] text-on-surface-variant transition-colors font-body text-body">Persian</button>
</div>
</div>
<!-- Theme Selector -->
<div class="flex flex-col space-y-xs">
<label class="font-section-title text-section-title text-on-surface">Theme Preference</label>
<div class="grid grid-cols-3 gap-sm">
<button class="flex flex-col items-center justify-center p-md border border-[#5B8CFF] rounded bg-[#1A2A4A] text-on-surface">
<span class="material-symbols-outlined mb-xs" style="font-variation-settings: 'FILL' 1;">desktop_windows</span>
<span class="font-body text-body">System</span>
</button>
<button class="flex flex-col items-center justify-center p-md border border-[#26303B] rounded hover:bg-[#171D26] text-on-surface-variant transition-colors">
<span class="material-symbols-outlined mb-xs">light_mode</span>
<span class="font-body text-body">Light</span>
</button>
<button class="flex flex-col items-center justify-center p-md border border-[#26303B] rounded hover:bg-[#171D26] text-on-surface-variant transition-colors">
<span class="material-symbols-outlined mb-xs">dark_mode</span>
<span class="font-body text-body">Dark</span>
</button>
</div>
</div>
<!-- Work Hours & Pomodoro (Bento style row) -->
<div class="grid grid-cols-2 gap-sm">
<div class="border border-[#26303B] rounded p-md bg-[#0B0F14] flex flex-col space-y-xs">
<label class="font-section-title text-section-title text-on-surface flex items-center">
<span class="material-symbols-outlined text-[16px] mr-xs">schedule</span> Work Hours
                        </label>
<div class="flex items-center space-x-sm">
<input class="app-input rounded w-full px-sm py-xs font-mono-code text-mono-code text-center" type="text" value="09:00">
<span class="text-on-surface-variant">-</span>
<input class="app-input rounded w-full px-sm py-xs font-mono-code text-mono-code text-center" type="text" value="17:00">
</div>
</div>
<div class="border border-[#26303B] rounded p-md bg-[#0B0F14] flex flex-col space-y-xs">
<label class="font-section-title text-section-title text-on-surface flex items-center">
<span class="material-symbols-outlined text-[16px] mr-xs">timer</span> Focus Session
                        </label>
<div class="flex items-center space-x-sm">
<input class="app-input rounded w-full px-sm py-xs font-mono-code text-mono-code text-center" type="number" value="25">
<span class="font-metadata text-metadata text-on-surface-variant">min</span>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-xl py-lg border-t border-[#26303B] flex items-center justify-between bg-[#0E131A] rounded-b-lg">
<button class="px-lg py-sm text-on-surface-variant hover:text-on-surface font-body text-body transition-colors focus:outline-none focus:ring-2 focus:ring-[#5B8CFF] rounded">
                    Cancel
                </button>
<div class="flex space-x-md">
<!-- Simulate Saving State Button (Hidden by default, shown for example) -->
<button class="hidden px-lg py-sm bg-primary-container text-[#F3F6F9] rounded font-body text-body flex items-center opacity-80 cursor-not-allowed">
<span class="material-symbols-outlined animate-spin mr-xs text-[16px]">progress_activity</span>
                        Saving...
                    </button>
<!-- Normal Continue Button -->
<button class="px-lg py-sm bg-primary-container text-[#F3F6F9] rounded font-body text-body hover:bg-[#4A7CEE] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#11161D] focus:ring-[#5B8CFF] flex items-center shadow-sm">
                        Continue
                        <span class="material-symbols-outlined ml-xs text-[16px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
