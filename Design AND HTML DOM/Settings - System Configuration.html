<style>
        body { background-color: #0B0F14; color: #d8e4f1; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #26303B; border-radius: 10px; }
        
        .form-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid #26303B;
            border-radius: 2px;
            background-color: #0B0F14;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .form-checkbox:checked {
            background-color: #5B8CFF;
            border-color: #5B8CFF;
        }
        .form-checkbox:checked::after {
            content: '✓';
            color: #F3F6F9;
            font-size: 12px;
            line-height: 1;
        }
        
        .setting-section {
            display: none;
        }
        .setting-section.active {
            display: block;
        }
        
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast {
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast.hiding {
            animation: fadeOut 0.3s ease-out forwards;
        }
    </style>

<span class="material-symbols-outlined text-[#5B8CFF]" data-icon="check_circle">check_circle</span>
<span>Settings saved successfully</span>
</div>
<script>
        // Simple tab switching logic
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active classes
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.className = 'nav-btn flex items-center justify-between w-full px-sm py-sm text-left rounded text-on-surface hover:bg-[#171D26]';
                });
                document.querySelectorAll('.setting-section').forEach(s => s.classList.remove('active'));
                
                // Add active to clicked
                btn.className = 'nav-btn flex items-center justify-between w-full px-sm py-sm text-left rounded bg-[#1A2A4A] border-l-2 border-[#5B8CFF] text-[#F3F6F9]';
                document.getElementById(btn.dataset.target).classList.add('active');
            });
        });

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.transform = 'translateY(24px)';
                toast.style.opacity = '0';
            }, 3000);
        }
    </script>
