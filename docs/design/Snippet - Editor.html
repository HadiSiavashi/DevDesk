 * Optimized fetch function for user data with caching
 * and automatic retry logic.
 */
import { UserData, CacheConfig } from '@core/types';
import { getCache, setCache } from '@utils/cache';

const CACHE_KEY = 'user_data_current';
const MAX_RETRIES = 3;

export async function fetchUserData(
  userId: string,
  forceRefresh = false
): Promise&lt;UserData&gt; {
  // Check cache first if not forced
  if (!forceRefresh) {
    const cached = await getCache&lt;UserData&gt;(`${CACHE_KEY}_${userId}`);
    if (cached) {
      console.log('Cache hit for user data');
      return cached;
    }
  }

  let attempt = 0;
  while (attempt &lt; MAX_RETRIES) {
    try {
      const response = await fetch(`/api/v1/users/${userId}`, {
        headers: {
          'Cache-Control': 'no-cache',
          'X-Request-ID': crypto.randomUUID()
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data: UserData = await response.json();
      
      // Update cache asynchronously
      setCache(`${CACHE_KEY}_${userId}`, data, { ttl: 3600 }).catch(console.error);
      
      return data;
    } catch (error) {
      attempt++;
      console.warn(`Attempt ${attempt} failed:`, error);
      if (attempt === MAX_RETRIES) {
        throw new Error(`Failed to fetch user data after ${MAX_RETRIES} attempts`);
      }
      // Exponential backoff
      await new Promise(r =&gt; setTimeout(r, 1000 * Math.pow(2, attempt - 1)));
    }
  }
}
