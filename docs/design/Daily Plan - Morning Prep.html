<!DOCTYPE html>

<html class="dark" dir="ltr" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DevDesk - Daily Plan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#002c72",
                        "on-primary-fixed": "#001847",
                        "secondary": "#c2c6d0",
                        "on-secondary-fixed": "#171c23",
                        "surface-bright": "#2f3a44",
                        "on-tertiary": "#4b2800",
                        "surface-container-highest": "#2b3640",
                        "background": "#09151d",
                        "tertiary-container": "#d47b00",
                        "on-surface": "#d8e4f1",
                        "surface-container-low": "#111d26",
                        "secondary-fixed": "#dee2ed",
                        "tertiary-fixed-dim": "#ffb874",
                        "inverse-on-surface": "#26323b",
                        "inverse-primary": "#1857c8",
                        "surface-container": "#15212a",
                        "surface": "#09151d",
                        "primary-fixed": "#dae2ff",
                        "outline-variant": "#434653",
                        "on-error-container": "#ffdad6",
                        "on-background": "#d8e4f1",
                        "on-primary-fixed-variant": "#0040a0",
                        "tertiary": "#ffb874",
                        "surface-dim": "#09151d",
                        "on-tertiary-fixed": "#2d1600",
                        "primary": "#b2c5ff",
                        "surface-variant": "#2b3640",
                        "on-secondary-container": "#b7bcc6",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-tertiary-container": "#412200",
                        "on-secondary-fixed-variant": "#42474f",
                        "tertiary-fixed": "#ffdcbf",
                        "on-tertiary-fixed-variant": "#6a3b00",
                        "on-secondary": "#2c3138",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#040f18",
                        "on-primary-container": "#002665",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#c2c6d0",
                        "surface-container-high": "#202b35",
                        "error-container": "#93000a",
                        "inverse-surface": "#d8e4f1",
                        "outline": "#8d909f",
                        "on-surface-variant": "#c3c6d6",
                        "primary-container": "#5b8cff",
                        "secondary-container": "#474c54",
                        "surface-tint": "#b2c5ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "16px",
                        "gutter": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "xl": "24px",
                        "xxl": "32px",
                        "sidebar_width": "240px",
                        "md": "12px"
                    },
                    "fontFamily": {
                        "mono-timer": ["JetBrains Mono"],
                        "body": ["Geist"],
                        "section-title": ["Geist"],
                        "mono-code": ["JetBrains Mono"],
                        "metadata": ["Geist"],
                        "page-title": ["Geist"]
                    },
                    "fontSize": {
                        "mono-timer": ["14px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "section-title": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "mono-code": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "metadata": ["11px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "page-title": ["19px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0B0F14; color: #d8e4f1; }
        .app-input {
            background-color: #0B0F14;
            border: 1px solid #26303B;
            color: #d8e4f1;
        }
        .app-input:focus {
            border-color: #5B8CFF;
            outline: none;
            box-shadow: 0 0 0 2px rgba(91, 140, 255, 0.2);
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden font-body text-body bg-background selection:bg-primary-container selection:text-on-primary-container">
<!-- SideNavBar -->
<nav class="docked h-full w-[240px] rtl:right-0 ltr:left-0 border-r border-outline-variant dark:border-outline-variant rtl:border-l rtl:border-r-0 bg-surface-container-low dark:bg-surface-container-low flex flex-col h-screen py-md overflow-y-auto hidden md:flex shrink-0">
<div class="px-lg pb-xl pt-sm flex flex-col gap-xs">
<h1 class="font-page-title text-page-title font-bold text-on-surface">DevDesk</h1>
<span class="font-metadata text-metadata text-on-surface-variant">Productivity Engine</span>
</div>
<div class="flex flex-col gap-xs px-sm flex-1">
<a class="flex items-center gap-md px-md py-sm rounded text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-all duration-200 ease-in-out group" href="#">
<span class="material-symbols-outlined text-[18px]">dashboard</span>
<span class="font-section-title text-section-title">Dashboard</span>
</a>
<a class="flex items-center gap-md px-md py-sm rounded text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-all duration-200 ease-in-out group" href="#">
<span class="material-symbols-outlined text-[18px]">sunny</span>
<span class="font-section-title text-section-title">My Day</span>
</a>
<a class="flex items-center gap-md px-md py-sm rounded text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-all duration-200 ease-in-out group" href="#">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
<span class="font-section-title text-section-title">Tasks</span>
</a>
<a class="flex items-center gap-md px-md py-sm rounded bg-secondary-container dark:bg-secondary-container border-l-2 border-primary dark:border-primary-fixed text-on-secondary-container transition-all duration-200 ease-in-out" href="#">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">event_note</span>
<span class="font-section-title text-section-title text-primary dark:text-primary-fixed-dim">Daily Plan</span>
</a>
<a class="flex items-center gap-md px-md py-sm rounded text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-all duration-200 ease-in-out group" href="#">
<span class="material-symbols-outlined text-[18px]">settings</span>
<span class="font-section-title text-section-title">Settings</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
<!-- TopNavBar (Mobile) -->
<header class="md:hidden flex justify-between items-center w-full px-lg h-[48px] border-b border-outline-variant bg-surface shrink-0">
<span class="font-page-title text-page-title font-bold text-on-surface">DevDesk</span>
<span class="material-symbols-outlined text-primary">add</span>
</header>
<main class="flex-1 overflow-y-auto p-lg lg:p-xxl flex flex-col gap-xxl max-w-4xl mx-auto w-full">
<header class="flex items-center justify-between border-b border-outline-variant pb-md">
<div>
<h2 class="font-page-title text-page-title text-on-surface">Daily Plan</h2>
<p class="font-metadata text-metadata text-on-surface-variant mt-xs" id="current-date"></p>
</div>
<button class="bg-primary-container text-on-primary-container px-lg py-sm rounded font-section-title text-section-title hover:bg-primary transition-colors flex items-center gap-sm">
<span class="material-symbols-outlined text-[16px]">save</span>
                    Save
                </button>
</header>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-lg">
<!-- Goals Section -->
<div class="lg:col-span-2 flex flex-col gap-lg">
<div class="bg-[#11161D] border border-[#26303B] rounded-lg p-lg">
<h3 class="font-section-title text-section-title text-on-surface mb-md flex items-center gap-sm">
<span class="material-symbols-outlined text-[18px] text-primary">target</span>
                            Top Goals
                        </h3>
<div class="flex flex-col gap-md">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="font-mono-timer text-mono-timer text-on-surface-variant">01</span>
</div>
<input class="app-input w-full pl-xl py-sm rounded font-body text-body" placeholder="Primary objective for today..." type="text"/>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="font-mono-timer text-mono-timer text-on-surface-variant">02</span>
</div>
<input class="app-input w-full pl-xl py-sm rounded font-body text-body" placeholder="Secondary objective..." type="text"/>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="font-mono-timer text-mono-timer text-on-surface-variant">03</span>
</div>
<input class="app-input w-full pl-xl py-sm rounded font-body text-body" placeholder="Tertiary objective..." type="text"/>
</div>
</div>
</div>
</div>
<!-- Metrics Section -->
<div class="flex flex-col gap-lg">
<div class="bg-[#11161D] border border-[#26303B] rounded-lg p-lg">
<h3 class="font-section-title text-section-title text-on-surface mb-md flex items-center gap-sm">
<span class="material-symbols-outlined text-[18px] text-primary">schedule</span>
                            Workload Metrics
                        </h3>
<div class="flex flex-col gap-md">
<div>
<label class="block font-metadata text-metadata text-on-surface-variant mb-xs">Available Work Minutes</label>
<input class="app-input w-full px-sm py-sm rounded font-mono-timer text-mono-timer" id="avail-mins" type="number" value="480"/>
</div>
<div class="pt-sm border-t border-outline-variant">
<label class="block font-metadata text-metadata text-on-surface-variant mb-xs">Computed Workload (mins)</label>
<div class="flex items-center justify-between">
<span class="font-mono-timer text-mono-timer text-on-surface text-[24px]">520</span>
</div>
</div>
<div class="bg-error-container/20 border border-error-container/50 rounded p-sm flex items-start gap-sm mt-xs">
<span class="material-symbols-outlined text-[16px] text-error mt-xs">warning</span>
<div>
<span class="block font-section-title text-section-title text-error text-[12px]">Overload Warning</span>
<span class="block font-metadata text-metadata text-error/80 mt-[2px]">Computed workload exceeds available time.</span>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
</div>
<script>
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    </script>
</body></html>
